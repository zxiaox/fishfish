name: Windows builds
on:
  push:
    branches: [main]
    tags: ['work-motivator-v*', 'monty-hall-v*', 'war3-battle-platform-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        app: [work-motivator, monty-hall, war3-battle-platform]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==44.0.3 Pillow==12.2.0
      - run: python -m unittest discover -s tests -v
      - name: Windows UI startup smoke test
        if: matrix.app == 'war3-battle-platform'
        run: python tests/windows_war3_smoke.py
      - name: Windows Work Motivator countdown smoke test
        if: matrix.app == 'work-motivator'
        run: python tests/windows_work_smoke.py
      - name: Windows Three Doors interaction smoke test
        if: matrix.app == 'monty-hall'
        run: python tests/windows_monty_smoke.py
      - run: python -m pip install pyinstaller==6.11.1
      - run: python packaging/collect-licenses.py
      - name: Build executable
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "${{ matrix.app }}" --icon "assets/${{ matrix.app }}.ico" --paths . --add-data "shared/locales;shared/locales" --add-data "assets;assets" --add-data "THIRD-PARTY-NOTICES.txt;." --add-data "dist/DEPENDENCY-LICENSES.txt;." "apps/${{ matrix.app }}/main.py"
      - name: Package portable ZIP and checksums
        shell: pwsh
        run: ./packaging/package-windows.ps1 -App "${{ matrix.app }}" -Executable "dist/${{ matrix.app }}.exe" -OutputDirectory dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: |
            dist/${{ matrix.app }}.exe
            dist/${{ matrix.app }}.exe.sha256
            dist/${{ matrix.app }}-windows-x64-portable.zip
            dist/${{ matrix.app }}-windows-x64-portable.zip.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^(work-motivator|monty-hall|war3-battle-platform)-v([0-9]+\.[0-9]+\.[0-9]+)$') { throw 'Invalid release tag' }
          $app = $Matches[1]
          $tagVersion = $Matches[2]
          $version = python -c "from shared.common import VERSIONS; print(VERSIONS['$app'])"
          if ($tagVersion -ne $version) { throw 'Release tag must match the app version' }
          "APP=$app" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $dir = "artifacts/$env:APP-windows"
          gh release create "$env:TAG" "$dir/$env:APP.exe" "$dir/$env:APP.exe.sha256" "$dir/$env:APP-windows-x64-portable.zip" "$dir/$env:APP-windows-x64-portable.zip.sha256" --verify-tag --draft --title "$env:TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          gh release edit "$env:TAG" --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
